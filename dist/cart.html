<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MIROKU — Your bag</title>
    <meta
      name="description"
      content="Discover a thoughtful edit of everyday essentials at MIROKU."
    />
    <link rel="icon" href="assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Righteous&amp;display=swap"
    />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
    <script type="module" src="/navigation.js"></script>
    <link
      rel="preconnect"
      href="https://dfnqemmualhdswvlpawk.supabase.co"
      crossorigin
    />
    <link rel="modulepreload" href="/catalog.js" />
    <link rel="modulepreload" href="/html-utils.js" />
    <link rel="modulepreload" href="/format.js" />
    <link rel="modulepreload" href="/catalog-view.js" />
    <link rel="modulepreload" href="/delivery.js" />
    <link rel="modulepreload" href="/pricing.js" />
    <link rel="stylesheet" href="/loading.css" />
    <link rel="preload" as="image" href="/assets/loading-logo.png" />
    <script type="module" src="/loading.js"></script>
  </head>
  <body>
    <div
      id="site-loader"
      class="site-loader"
      role="status"
      aria-label="Loading MIROKU"
    >
      <img
        src="/assets/loading-logo.png"
        alt=""
        width="64"
        height="64"
        fetchpriority="high"
      />
    </div>
    <noscript
      ><style>
        .site-loader {
          display: none !important;
        }
      </style></noscript
    >
    <div class="announcement">
      GOOD THINGS. BIG ENERGY. <span aria-hidden="true">✳</span> MEET YOUR NEW
      EVERYDAY.
    </div>
    <header>
      <div class="header-start">
        <a
          class="back-arrow"
          href="/shop.html"
          aria-label="Go back"
          title="Go back"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m14 6-6 6 6 6M8 12h12" /></svg></a
        ><a class="brand" href="index.html" aria-label="MIROKU home"
          ><img src="assets/logo.png" alt="" /><img
            class="brand-wordmark"
            src="/assets/miroku-wordmark.webp"
            alt="MIROKU"
            width="2053"
            height="766"
        /></a>
      </div>
      <nav aria-label="Main navigation">
        <a href="index.html" data-page="home">Home</a
        ><a href="shop.html" data-page="shop">Shop</a>
      </nav>
      <a class="bag" href="cart.html" aria-label="View shopping bag"
        ><svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <path d="M5 7h14l1 14H4L5 7Z" />
          <path d="M8 8V6a4 4 0 0 1 8 0v2" /></svg
        ><span class="bag-label">Bag</span><span id="bag-count">0</span></a
      >
    </header>
    <main id="main">
      <div class="catalog-loading" role="status" aria-live="polite">
        <span>Loading your everyday essentials…</span>
        <div class="loading-tiles" aria-hidden="true">
          <div></div>
          <div></div>
          <div></div>
          <div></div>
        </div>
      </div>
      <noscript
        >Please enable JavaScript to browse products and use your bag.</noscript
      >
    </main>
    <footer>
      <div class="footer-top">
        <a class="brand" href="index.html">MIROKU</a>
        <p>Good things. Everyday.</p>
        <a href="shop.html">Explore the collection</a>
      </div>
      <div class="footer-bottom">
        <span>© 2026 MIROKU</span><span>Less, but better.</span
        ><span>Made for your everyday.</span>
      </div>
    </footer>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="details">
      <button class="close" aria-label="Close product details">×</button>
      <div id="detail-content"></div>
    </dialog>
  </body>
</html>
