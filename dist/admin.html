<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>MIROKU — Admin</title>
    <link rel="icon" href="/assets/logo.png" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/admin.css" />
    <script type="module" src="/admin.js"></script>
  </head>
  <body>
    <header>
      <a class="brand" href="/"><img src="/assets/logo.png" alt="" />MIROKU</a
      ><span class="admin-label">Store admin</span
      ><a href="/shop.html" class="text-link">View store</a>
    </header>
    <main class="admin-main">
      <div id="message" role="status" aria-live="polite"></div>
      <section id="login-panel" class="login-card">
        <div class="eyebrow">Your store, your space</div>
        <h1>Welcome back.</h1>
        <p>Sign in to manage your products.</p>
        <form id="login-form">
          <label
            >Email<input
              name="email"
              type="email"
              value="murokireview@gmail.com"
              autocomplete="username"
              required /></label
          ><label
            >Password<input
              name="password"
              type="password"
              autocomplete="current-password"
              required /></label
          ><button class="primary" type="submit" disabled>Sign in</button>
        </form>
        <button id="reset-password" class="text-button" disabled>
          Forgot your password?
        </button>
      </section>
      <section id="password-panel" class="login-card" hidden>
        <h1>Set your password.</h1>
        <form id="password-form">
          <label
            >New password<input
              name="password"
              type="password"
              minlength="12"
              autocomplete="new-password"
              required /></label
          ><button class="primary">Save password</button>
        </form>
      </section>
      <section id="workspace" hidden>
        <div class="admin-heading">
          <div>
            <div class="eyebrow">MIROKU collection</div>
            <h1>Your products.</h1>
            <p id="product-count"></p>
          </div>
          <div class="actions">
            <a class="secondary" href="/admin/orders">Orders</a
            ><button id="refresh" class="secondary">Refresh</button
            ><button id="new-product" class="primary">Add product</button
            ><button id="sign-out" class="text-button">Sign out</button>
          </div>
        </div>
        <div id="product-list" class="admin-products"></div>
      </section>
      <dialog id="product-dialog">
        <div class="dialog-heading">
          <h2 id="editor-title">Add product</h2>
          <button
            id="close-editor"
            class="text-button"
            aria-label="Close product editor"
          >
            ×
          </button>
        </div>
        <form id="product-form">
          <input name="id" type="hidden" />
          <div class="form-grid">
            <label
              >Product name<input name="name" maxlength="120" required /></label
            ><label
              >Category<input
                name="category"
                maxlength="60"
                required
                list="categories"
              /><datalist id="categories">
                <option>Wear</option>
                <option>Carry</option>
                <option>Tech</option>
                <option>Home</option>
              </datalist></label
            ><label
              >Selling price (₹)<input
                name="price"
                type="number"
                min="0.01"
                max="10000000"
                step="0.01"
                required /></label
            ><label
              >Original price (₹, optional)<input
                name="compare_at_price"
                type="number"
                min="0.01"
                max="10000000"
                step="0.01" /></label
            ><label
              >Discount (%)<input
                name="discount"
                type="number"
                min="0"
                max="99.99"
                step="0.01"
              /><span class="field-note"
                >Entering a discount calculates the selling price.</span
              ></label
            ><label
              >Delivery<select name="delivery_mode">
                <option value="unset">Not set</option>
                <option value="free">Free delivery</option>
                <option value="paid">Delivery charge</option>
              </select></label
            ><label id="delivery-cost-label" hidden
              >Delivery charge (₹)<input
                name="delivery_cost"
                type="number"
                min="0.01"
                max="100000"
                step="0.01"
              /><span class="field-note"
                >Charged once per product, regardless of quantity.</span
              ></label
            ><label
              >Stock quantity<input
                name="stock"
                type="number"
                min="0"
                max="1000000"
                step="1"
                required /></label
            ><label>Colour / variant<input name="color" maxlength="80" /></label
            ><label
              >Badge (optional)<input
                name="tag"
                maxlength="40"
                placeholder="New arrival"
            /></label>
          </div>
          <label
            >Description<textarea
              name="description"
              maxlength="3000"
              rows="4"
              required
            ></textarea></label
          ><label
            >Product photos (up to 4)<input
              multiple
              name="photo"
              type="file"
              accept="image/jpeg,image/png,image/webp"
          /></label>
          <p class="field-note">
            Add up to four JPEG, PNG or WebP photos, up to 10 MB each. The first
            photo is the cover.
          </p>
          <div id="photo-previews" class="photo-previews"></div>
          <label class="checkbox-label"
            ><input name="published" type="checkbox" />Publish on the
            storefront</label
          >
          <div class="actions">
            <button id="save-product" class="primary" type="submit">
              Save product</button
            ><button id="cancel-editor" class="secondary" type="button">
              Cancel
            </button>
          </div>
          <p id="editor-message" role="status"></p>
        </form>
      </dialog>
    </main>
  </body>
</html>
